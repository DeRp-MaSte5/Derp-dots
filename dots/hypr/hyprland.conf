#   VARIABLES


$mainMod = SUPER
$terminal = kitty
$fileManager = nemo
$menu = wofi --show drun

# Browser has two variables, $broswer and $browser_class
# See ~/.config/hypr/derpy/Windows&Workspaces.conf for $browser_class
$browser = waterfox


#   SOURCES


source = ~/.config/hypr/derpy/Monitors.conf

source = ~/.config/hypr/derpy/Bootup.conf

source = ~/.config/hypr/derpy/Windows&Workspaces.conf

source = ~/.config/hypr/derpy/Binds.conf

source = ~/.config/hypr/derpy/Look.conf

source = ~/.config/hypr/derpy/Feel.conf


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_THEME,Bibata-Modern-Ice
env = GDK_BACKEND,wayland,x11
ecosystem:no_update_news = true


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general


# https://wiki.hyprland.org/Configuring/Variables/#animations


# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more


# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    font_family = hack-nerd
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    # typically requires no change other then layout, maybe sensitivity.
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
        # if you turn this on, ill give you a one way ticket to hell.
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



